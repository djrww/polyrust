# polyrust workspace 根
#
# 結構：
#   core/           polyrust-core —— 形式化管線核心，【零第三方依賴】
#   frontends/http  polyrust-http —— axum/tokio HTTP API 前端（有第三方依賴）
#   frontends/llm   polyrust-llm  —— ureq 真實 TLS 傳輸的 LLM 前端（有第三方依賴）
#
# 核心承諾：`core` 永遠不引入任何第三方 crate（std-only）；
# 一切第三方依賴只允許出現在 frontends/* 之下。

[workspace]
resolver = "2"
members = ["core", "frontends/http", "frontends/llm"]

[workspace.package]
version = "0.2.0"
edition = "2021"
repository = "https://github.com/djrww/polyrust"

# 最優化執行期效能編譯（對全部成員生效）
[profile.release]
debug = false        # 不帶除錯符號
opt-level = 3        # 最高最佳化等級
lto = "fat"          # 全程式連結期最佳化：跨 crate 內聯與去死碼
codegen-units = 1    # 單一 codegen unit，給 LLVM 最大最佳化視野
panic = "abort"      # 移除 landing pad，縮小體積
strip = true         # 剝除符號表
overflow-checks = false

[profile.release-debug]
inherits = "release"
debug = true
strip = false
panic = "unwind"
