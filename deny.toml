[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]
exceptions = [
    { name = "polyrust-core", allow = ["AGPL-3.0-only"] },
    { name = "polyrust-http", allow = ["AGPL-3.0-only"] },
    { name = "polyrust-llm", allow = ["AGPL-3.0-only"] },
    { name = "polyrust-full", allow = ["AGPL-3.0-only"] },
    { name = "polyrust-ide", allow = ["AGPL-3.0-only"] },
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
ignore = []
