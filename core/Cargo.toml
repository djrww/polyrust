# polyrust-core：形式化管線核心。
#
# 硬承諾：【零第三方依賴】——[dependencies] 永遠為空（只用 std）。
# 一切需要第三方依賴的能力（axum HTTP、ureq TLS、serde、clap…）
# 一律放在上一層 workspace 的 frontends/* crate，把本核心當 lib 依賴。
[package]
name = "polyrust-core"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Mini-Rust 宏的代數形式化管線核心：CDCL + Buchberger + QAP（零第三方依賴）"
build = "build.rs"

# 同時產出函式庫（供 frontends/* 依賴）與二進位（polyrust，向後相容）。
[lib]
name = "polyrust_core"
path = "src/lib.rs"

[[bin]]
name = "polyrust"
path = "src/main.rs"

[[bin]]
name = "bench_f4f5"
path = "src/bench_f4f5.rs"

[dependencies]
# 刻意留空——這是本核心不變的承諾。

[dev-dependencies]
# 測試行真 serde_json 解析（同 `frontends/llbc` 嘅產品入口同源邏輯）；
# dev-only，釋出物 [dependencies] 仍然為空，零第三方依賴承諾不變。
# （曾試 dev-dep 循環 core→frontends/llbc：型別雙實例唔 unify，棄用。）
serde_json = { workspace = true }
