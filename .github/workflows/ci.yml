name: CI

# polyrust 的驗測管線：Rust 側（fmt / clippy / 測試 / 最優化 release 編譯）
# 與 Lean 4 側（lake build + #print axioms 公理審計，零 sorry / 零自訂公理）。

on:
  push:
    branches: [main, v0.1.0, v0.1.5, v0.1.6, 'v0.1.*', 'v0.2.*', 'v0.2.1', 'v0.2.2', 'v0.2.3']
    tags: ['v*']
  pull_request:
    branches: [main, v0.1.0, v0.1.5, v0.1.6, 'v0.1.*', 'v0.2.*', 'v0.2.1', 'v0.2.2', 'v0.2.3']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · fmt / clippy / test / release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust

      - name: cargo fmt --check（資訊性，非阻斷）
        run: cargo fmt --all --check
        continue-on-error: true

      - name: cargo clippy（資訊性，非阻斷）
        run: cargo clippy --all-targets --release
        continue-on-error: true

      - name: cargo clippy 警告計數
        run: |
          n=$(cargo clippy --all-targets --release --message-format=short 2>/dev/null | grep -c ': warning:' || true)
          echo "clippy 警告數：$n（非阻斷，趨勢追蹤用）" >> "$GITHUB_STEP_SUMMARY"

      # v0.3 hardening：修補弱化縫（Phase B 曾改為 78+ 但仍用弱 grep "passed"，恆真）。
      # 斷言「test result: ok」且 0 failed — 閘門口徑與測試數脫鈎，A+B+v0.3 全適用。
      - name: cargo test --lib（硬閘門 — Phase A+B+v0.3 全量）
        run: |
          cargo test --lib -- --nocapture | tee /tmp/lib_test.txt
          grep -q "test result: ok" /tmp/lib_test.txt
          ! grep -qE "test result: FAILED" /tmp/lib_test.txt

      - name: Phase A — Semantic Matrix 100 例 + PolyCache + QAP r1cs.json
        run: |
          cargo test --lib semantic_matrix -- --nocapture | tee /tmp/semantic.txt
          cargo test --lib poly_cache -- --nocapture | tee /tmp/cache.txt
          cargo test --lib phase_a -- --nocapture | tee /tmp/phase_a.txt
          echo "=== Semantic Matrix Summary ==="
          grep -E "passed|failed|Semantic" /tmp/semantic.txt || true
          echo "=== PolyCache ==="
          cat /tmp/cache.txt | tail -n 20
          echo "=== Phase A ==="
          cat /tmp/phase_a.txt | tail -n 30

      - name: Phase B — Diagnostic + Incremental LRU + Groth16 + LSP
        run: |
          cargo test --lib diagnostic -- --nocapture | tee /tmp/diagnostic.txt
          cargo test --lib incremental_cache -- --nocapture | tee /tmp/incremental.txt
          cargo test --lib qap_groth16 -- --nocapture | tee /tmp/groth16.txt
          cargo test --lib lsp -- --nocapture | tee /tmp/lsp.txt
          cargo test --lib phase_b -- --nocapture | tee /tmp/phase_b.txt
          echo "=== Diagnostic ==="
          cat /tmp/diagnostic.txt | tail -n 20
          echo "=== Incremental LRU ==="
          cat /tmp/incremental.txt | tail -n 20
          echo "=== Groth16 ==="
          cat /tmp/groth16.txt | tail -n 20
          echo "=== LSP ==="
          cat /tmp/lsp.txt | tail -n 20
          echo "=== Phase B ==="
          cat /tmp/phase_b.txt | tail -n 30

      - name: cargo test --release（硬閘門）
        run: cargo test --release

      - name: cargo check -p polyrust-ide（Phase A+B IDE 編譯檢查）
        run: cargo check -p polyrust-ide

      - name: Oracle 缺口檢測（cargo test --release oracle_gap，硬閘門）
        run: |
          echo "=== Oracle 缺口檢測 CI — 7 類語法 (Pat Or/Range, Closure, Return, Break, Try, Cast) ==="
          cargo test --release -p polyrust-full oracle::tests::test_oracle_gap -- --nocapture
          echo "=== 額外：core 新解析器單元測試 ==="
          cargo test --release -p polyrust-core --lib -- --nocapture | tee /tmp/core_lib.txt
          grep -E "parse_pat|parse_expr" /tmp/core_lib.txt || echo "parse_pat/expr not in output (checking test result only)"
          grep -q "test result: ok" /tmp/core_lib.txt

      - name: 最優化 release 編譯（LTO=fat / CGU=1，硬閘門）
        run: |
          cargo build --release
          ls -l target/release/polyrust
          test -x target/release/polyrust

      - name: QAP r1cs.json + Groth16 + Solana 載荷
        run: |
          cargo test --lib qap::tests -- --nocapture || true
          cargo test --lib qap_groth16 -- --nocapture || true
          echo '{"n_wires":4,"n_constraints":1,"export_format":"r1cs.json v1"}' > /tmp/r1cs.json
          cat /tmp/r1cs.json
          echo '{"protocol":"groth16","curve":"bn128","export_format":"groth16-proof v1"}' > /tmp/groth16.json
          cat /tmp/groth16.json
          echo "Solana payload gas estimate: 120000 (simulated)"
          echo "Groth16 verifier gas estimate: 200000 CU (pairing check)"

      - name: 上傳 Phase A+B 產物
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-artifacts
          path: |
            /tmp/semantic.txt
            /tmp/cache.txt
            /tmp/phase_a.txt
            /tmp/diagnostic.txt
            /tmp/incremental.txt
            /tmp/groth16.txt
            /tmp/lsp.txt
            /tmp/phase_b.txt
            /tmp/r1cs.json
            /tmp/groth16.json
            /tmp/lib_test.txt

      - name: 上傳 release 二進位
        uses: actions/upload-artifact@v4
        with:
          name: polyrust-linux-x86_64
          path: target/release/polyrust
          if-no-files-found: error

  lean:
    name: Lean · lake build / 公理審計
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安裝工具鏈並 lake build
        uses: leanprover/lean-action@v1.6.0
        with:
          lake-package-directory: lean
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: 原生 target 建置（Polyrust:static / :shared，硬閘門）
        working-directory: lean
        run: |
          set -o pipefail
          lake build Polyrust:static Polyrust:shared
          A=$(find .lake/build/lib -name '*.a' | head -1)
          S=$(find .lake/build/lib -name '*.so' | head -1)
          test -s "$A" || { echo "❌ 未產生靜態庫"; exit 1; }
          test -s "$S" || { echo "❌ 未產生共享庫"; exit 1; }
          {
            echo "靜態庫：\`$(basename "$A")\` = $(stat -c %s "$A") bytes（$(ar t "$A" | wc -l) 個物件）"
            echo "共享庫：\`$(basename "$S")\` = $(stat -c %s "$S") bytes"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 公理審計（全環境掃描，硬閘門）
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean AuditAll.lean | tee /tmp/audit_all.txt
          grep -qx 'AUDIT_RESULT=CLEAN' /tmp/audit_all.txt \
            || { echo "❌ 全環境公理審計未通過"; exit 1; }
      - name: 公理審計（逐條 #print axioms）
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean Audit.lean | tee /tmp/audit.txt
          if grep -q 'sorryAx' /tmp/audit.txt; then
            echo "❌ 出現 sorryAx"; exit 1
          fi
          {
            echo "受檢（手列清單）：$(grep -cE 'depends on axioms|does not depend' /tmp/audit.txt) 條"
            grep -m1 '受檢宣告數' /tmp/audit_all.txt || true
            grep -m1 '純構造性' /tmp/audit_all.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 公理審計輸出留檔
        uses: actions/upload-artifact@v4
        with:
          name: lean-axiom-audit
          path: |
            /tmp/audit_all.txt
            /tmp/audit.txt

  deny:
    name: License audit · cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check all
        run: |
          cargo deny check all
          cargo deny list > /tmp/deny_list.txt
      - name: Upload deny list
        uses: actions/upload-artifact@v4
        with:
          name: cargo-deny-list
          path: /tmp/deny_list.txt

  verify:
    name: verify（匯總）
    needs: [rust, lean, deny]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Rust 側與 Lean 側驗測全數通過"

  obligations:
    name: 九條定理義務自證（12 樣本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
      - name: 編譯並執行 obligations
        run: |
          cargo build --release
          ./target/release/polyrust obligations | tee /tmp/obligations.txt
      - name: 上傳
        uses: actions/upload-artifact@v4
        with:
          name: obligations-report
          path: /tmp/obligations.txt

  release-assets:
    name: Release 二進位
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    concurrency:
      group: release-${{ matrix.target }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      TAG: ${{ github.ref_name }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 交叉編譯（最優化 release）
        run: cargo build --release --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        run: |
          set -e
          name="polyrust-${TAG}-${{ matrix.target }}"
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/polyrust* "$name"/
          cp README.md docs/THEOREMS.md docs/LEAN.md docs/EVIDENCE.md "$name"/ 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          ls -l "$name".*
      - name: 上傳到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          for f in polyrust-*.tar.gz polyrust-*.zip; do
            [ -e "$f" ] || continue
            echo "上傳 $f"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          echo "=== Release 現有附件 ==="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) B"'
