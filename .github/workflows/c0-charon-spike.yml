# C0 Charon Spike —— 借 CI runner（16GB RAM）執行沙箱 2GB 做唔到嘅嘢：
#   build pinned Charon → 跑全量 124 案例 → 發佈結果 + fixtures + 可執行 binary
# 觸發：Actions 頁手動 Run（workflow_dispatch）、push 到 c0-charon* 分支，
# 或 push 到 v0.2.4（M0 主線：結果直接回寫該分支 m0/ 下，沙箱 git fetch 即取）。
name: c0-charon-spike

on:
  workflow_dispatch:
  push:
    branches: [c0-charon*, c0-spike*, v0.2.4]

permissions:
  contents: write   # 建 release / commit results 回傳需要

jobs:
  c0-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout polyrust（corpus 同 harness 所在）
        uses: actions/checkout@v4

      - name: Install rustup + pinned toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          TOOLCHAIN=$(grep '^rust_toolchain:' charon.pin | awk '{print $2}')
          # miri：C0 觀察 35 例 rustc_reject 日誌含 "cargo-miri is not installed"
          # ——charon 內部以 cargo-miri 取 MIR；無 miri 會誤分類（v0.2.5 修）
          rustup toolchain install "$TOOLCHAIN" --profile minimal \
            --component rust-src --component rustc-dev --component llvm-tools --component miri

      - name: Clone + pin Charon
        run: |
          COMMIT=$(grep '^charon_commit:' charon.pin | awk '{print $2}')
          git clone https://github.com/AeneasVerif/charon /tmp/charon-src
          cd /tmp/charon-src && git checkout "$COMMIT"
          printf '[toolchain]\nchannel = "%s"\ncomponents = ["rustc-dev","llvm-tools","rust-src"]\ntargets = ["x86_64-unknown-linux-gnu"]\n' \
            "$(grep '^rust_toolchain:' $OLDPWD/charon.pin | awk '{print $2}')" \
            | tee rust-toolchain charon/rust-toolchain

      - name: Build Charon（release，locked）
        run: |
          cd /tmp/charon-src/charon
          cargo build --release --locked -j4

      - name: 全量 spike（100 matrix + examples + phase3）
        run: |
          python3 scripts/c0_spike.py --charon /tmp/charon-src/charon/target/release/charon \
            --out spike_out --fixtures charon_fixtures

      - name: 收集 artifacts
        run: |
          mkdir -p dist
          tar czf dist/charon-bin-x86_64-ubuntu24.04.tar.gz \
            -C /tmp/charon-src/charon/target/release charon charon-driver
          tar czf dist/c0-spike-results.tar.gz spike_out charon_fixtures
          cat spike_out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts（Actions 頁可下載）
        uses: actions/upload-artifact@v4
        with:
          name: c0-charon-spike
          path: dist/
          retention-days: 90

      - name: 發佈 Release assets（public repo 可匿名 curl）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: c0-charon-spike
          name: C0 Charon Spike（auto）
          body_path: spike_out/summary.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 回寫結果到觸發分支（v0.2.4：m0/ 下，沙箱 git fetch 即取）
        if: startsWith(github.ref, 'refs/heads/v0.2')
        run: |
          git config user.email "ci@polyrust.invalid"
          git config user.name "ci-c0-spike"
          mkdir -p m0
          rm -rf m0/spike_out m0/charon_fixtures
          cp -r spike_out m0/spike_out
          cp -r charon_fixtures m0/charon_fixtures 2>/dev/null || true
          git add m0
          git commit -m "M0 spike results → ${{ github.ref_name }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "nothing to commit"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: 回寫結果到 c0-results 分支（public repo 沙箱可匿名 fetch）
        run: |
          git config user.email "ci@polyrust.invalid"
          git config user.name "ci-c0-spike"
          git checkout --orphan c0-results || git checkout c0-results
          git reset --hard
          mkdir -p c0/spike_out c0/charon_fixtures
          cp -r spike_out/* c0/spike_out/
          cp -r charon_fixtures/* c0/charon_fixtures/ 2>/dev/null || true
          git add c0
          git commit -m "C0 spike results ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "nothing to commit"
          git push -f origin HEAD:c0-results
