name = "polyrust-formal"
version = "1.0.0"
defaultTargets = ["Polyrust"]

# polyrust 的 Lean 4 形式化：docs/THEOREMS.md 核心引理的機械證明。
# 無 Mathlib 依賴，僅用 Lean 4 core（自包含、易復現）。

# ---- v0.1.0 發布版：最優化執行期效能 ----
# buildType = "release"：C 編譯採 -O3 -DNDEBUG（關閉斷言、最高一般優化）。
# moreLeancArgs：
#   -march=native -mtune=native：針對本機 CPU（x86-64，AVX2/AVX-512）生成特化指令；
#   -flto=thin：ThinLTO 跨模組合併優化（連結期亦需 -flto=thin，見 moreLinkArgs）；
#   -ffat-lto-objects：.o 同時內嵌原生碼，靜態庫（.a）即使不用 LTO 連結亦可正常使用。
# 注意：-march=native 產物僅保證在本機同級 CPU 上執行；需可攜版請改用
# -march=x86-64-v3（或刪去此兩行回到預設 -O3 -DNDEBUG）後重建。
#
# 【實測標註 2026-09-10】這些參數**只在建原生 target 時生效**，須注意：
#
#   lake build                              → 只建 defaultTargets（Polyrust），
#                                             僅產 .olean/.ilean/.c，不呼叫 C 編譯器，
#                                             上述旗標完全不參與（實測 17 jobs，0 個 .o/.a）
#   lake build Polyrust:static Polyrust:shared
#                                           → 33 jobs：15 個模組各編一個 :c.o，
#                                             再 ar 成 .a、lld 成 .so，旗標在此生效
#
# 實測佐證（Lean v4.33.1，AVX2/AVX-512 可用之主機）：
#   含 -march=native -flto=thin ：.a = 874 818 B，.so = 253 944 B
#   拿掉 -march=native          ：.a = 787 954 B（−11.0%），.so = 254 248 B
# .a 相差 11% 證明旗標確實作用於物件碼。（.o 為中間產物，建完即清，
# 故 find 看不到 .o，但 .a 內含 15 個物件。）
#
# 注意：本庫零 `@[extern]`、零 `native_decide`，故原生庫不改變任何證明的可信度
# （定理判定一律走 Lean kernel 檢查 .olean）；原生庫僅供需要嵌入執行時使用。
# 又 -march=native 的產物僅能在同級 CPU 執行，**不宜作為对外发布的可攜 artifact**；
# 需可攜版請改 -march=x86-64-v3 後重建。
buildType = "release"
moreLeancArgs = ["-march=native", "-mtune=native", "-flto=thin", "-ffat-lto-objects"]
moreLinkArgs = ["-flto=thin", "-march=native"]

[[lean_lib]]
name = "Polyrust"
