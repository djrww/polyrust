[package]
name = "polyrust-http"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "polyrust 的 axum/tokio HTTP API 前端（第三方依賴：axum、tokio、serde）"

[[bin]]
name = "polyrust-http"
path = "src/main.rs"

[dependencies]
polyrust-core = { path = "../../core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
